[pytest]
# Every organ has its own tests/test_api.py, tests/conftest.py, etc.
# None of the test directories are Python packages (no __init__.py) —
# by design, since each organ's conftest.py does its own sys.path
# manipulation to import that organ's modules by bare name by itself.
#
# Without this setting, running `pytest` from this root collides:
# pytest's default import mode identifies test modules by their bare
# filename, so memory/tests/test_api.py and orchestrator/tests/test_api.py
# both try to register as module "test_api" and collection fails with
# "import file mismatch" on the second one found.
#
# --import-mode=importlib identifies test modules by file path instead,
# so identically-named files in different directories never collide.
# This only changes how PYTEST imports test files — it has no effect on
# each conftest.py's own `import memory_core` (etc.) style imports,
# which are ordinary Python imports resolved via sys.path, unaffected
# by this setting either way.
addopts = --import-mode=importlib
